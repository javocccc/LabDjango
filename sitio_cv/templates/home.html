{% extends "base.html" %}

{% block title %}Inicio del grupo{% endblock %}

{% block content %}
<h2>Integrantes del Grupo</h2>
<p>Selecciona un integrante para consultar su currículum vitae:</p>

<ul style="list-style-type: none; padding: 0; display: flex; flex-direction: column; gap: 10px;">
    {% for integrante in integrantes %}
        <li style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 18px;">
            <a href="{{ integrante.url }}" style="text-decoration: none; font-weight: 600; font-size: 1.05rem;">
                {{ integrante.nombre }} &rarr;
            </a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
